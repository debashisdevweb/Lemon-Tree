name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: Playwright, axe and screenshot diffs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # build:verify and e2e share NEXT_DIST_DIR; a plain `npm run build` here
      # would leave the Playwright server pointing at a directory that does not
      # exist. See distDir in next.config.ts.
      - run: npm run build:verify
      # Screenshot baselines are committed per platform and were generated on
      # macOS, so the visual specs cannot match on ubuntu. They stay a local
      # gate; everything else runs here.
      - run: npm run e2e -- --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  budgets:
    name: Core Web Vitals budget
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:verify
      # Desktop: LCP < 2.5s, CLS < 0.1, TBT < 200ms. Currently passing.
      - run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      # Mobile, simulated 4G: the brief's stated target. Currently FAILING at
      # ~3.2s LCP against the 2.5s budget — see "Performance" in README.md.
      # Left enforcing on purpose: this should go green, not be silenced.
      - run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.mobile.json
